[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fieldbook"
version = "0.1.0"
description = "Local-first experiment ledger for AI research agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
fieldbook = "fieldbook.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fieldbook"]

[tool.hatch.build.targets.wheel.force-include]
"src/fieldbook/migrations" = "fieldbook/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
